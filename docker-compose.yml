services:
  db:
    image: ankane/pgvector:latest
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: job_scout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"

  backend:
    build: ./backend
    image: job-scout-backend:latest
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:password@db:5432/job_scout
      - REDIS_URL=redis://redis:6379/0
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./models:/models
    depends_on:
      - db
      - redis

  scraper:
    build: ./scraper
    image: job-scout-scraper:latest
    command: celery -A celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:password@db:5432/job_scout
      - REDIS_URL=redis://redis:6379/0
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./models:/models
      - ./backend:/backend
    depends_on:
      - db
      - redis

  celery-beat:
    image: job-scout-scraper:latest
    command: celery -A celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./models:/models
      - ./backend:/backend
    depends_on:
      - redis
      - scraper

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:



